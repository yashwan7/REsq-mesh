name: resqmesh-central-hub
region: blr
services:
- name: api-backend
  github:
    branch: main
    deploy_on_push: true
    repo: yashwan7/REsq-mesh
  dockerfilePath: Dockerfile
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /api
  envs:
  - key: HOST
    value: 0.0.0.0
  - key: PORT
    value: "8000"
  - key: OLLAMA_HOST
    value: "http://127.0.0.1:11434"
  - key: OLLAMA_MODEL
    value: "qwen2.5:0.5b"
  - key: ENVIRONMENT
    value: "production"
  - key: REGION
    value: "blr1-bengaluru"
